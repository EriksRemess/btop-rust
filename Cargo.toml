[package]
name = "btoprs"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
description = "A dependency-free terminal resource monitor"
readme = "README.md"
repository = "https://github.com/EriksRemess/btop-rust"
keywords = ["system-monitor", "terminal", "tui", "linux", "macos"]
categories = ["command-line-utilities"]

[[bin]]
name = "btoprs"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
