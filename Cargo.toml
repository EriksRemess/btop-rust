[package]
name = "btoprs"
version = "0.3.2"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "A dependency-free terminal resource monitor"
readme = "README.md"
repository = "https://github.com/EriksRemess/btop-rust"
keywords = ["system-monitor", "tui", "linux", "macos", "windows"]
categories = ["command-line-utilities"]

[[bin]]
name = "btoprs"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
